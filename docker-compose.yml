services:
  vps:
    build: .
    ports:
      - "127.0.0.1:3000:3000" # только localhost, не 0.0.0.0 — безопасно
    environment:
      - WEB_USER=admin
      - WEB_PASSWORD=admin123 # ПОМЕНЯЙ на сложный!
      - PORT=3000
    # контейнер и так root внутри, но хост не трогает
    # для "настоящий VPS" apt работает: apt update && apt install nginx -y
