<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VPS Root</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>body{margin:0;background:#111;color:#0f0}#h{padding:8px;background:#222;display:flex;justify-content:space-between} #t{height:calc(100vh - 36px)}</style>
</head><body>
<div id="h"><span>VPS ROOT (Docker) — пароль обязателен</span><span>apt работает: sudo apt update</span></div>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
const term=new Terminal({cursorBlink:true}); const fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById('t')); fit.fit();
let ws, reconnectDelay=1000;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);
  ws.onopen=()=>{ reconnectDelay=1000; term.writeln('\x1b[32mConnected as ROOT inside container. Попробуй: whoami, apt update\x1b[0m'); term.focus(); };
  ws.onmessage=e=>term.write(e.data);
  ws.onclose=e=>{
    if(e.reason && e.reason.includes('bad auth')){ term.writeln('\r\n\x1b[31mClosed bad auth - проверь WEB_PASSWORD\x1b[0m'); return; }
    term.writeln('\r\n\x1b[33mClosed ('+(e.reason||e.code)+') - реконнект через '+reconnectDelay/1000+'с...\x1b[0m');
    setTimeout(connect, reconnectDelay);
    reconnectDelay=Math.min(reconnectDelay*2,10000);
  };
  ws.onerror=()=>{ try{ws.close()}catch{} };
}
connect();
term.onData(d=>{ try{ws.send(d)}catch{} });
term.onResize(({cols,rows})=>{try{ws.send(JSON.stringify({cols,rows}))}catch{}}); window.onresize=()=>fit.fit();
// keepalive ping каждые 30с чтобы Railway не убивал idle WS
setInterval(()=>{ try{ if(ws && ws.readyState===1) ws.send('') }catch{} },30000);
</script></body></html>
