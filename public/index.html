<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  body { margin:0; background:#1a1b26; color:#c0caf5; font-family: monospace; }
  #header { padding:10px; background:#24283b; display:flex; justify-content:space-between; align-items:center; }
  #terminal { height: calc(100vh - 50px); padding:10px; }
  .warn { color:#f7768e; font-size:12px; }
</style>
</head>
<body>
<div id="header">
  <span>Web Console (non-root) — защищено паролем</span>
  <span class="warn">НЕ запускай sudo / su — контейнер не привилегирован</span>
</div>
<div id="terminal"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
  const term = new Terminal({ cursorBlink:true, fontSize:14, theme:{ background:'#1a1b26' } });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(proto + '//' + location.host);

  ws.onopen = () => {
    term.writeln('\x1b[32mConnected. Введи команды. Это НЕ root — обычный юзер контейнера.\x1b[0m');
    term.focus();
  };
  ws.onmessage = e => term.write(e.data);
  ws.onclose = e => term.writeln('\r\n\x1b[31mDisconnected: '+e.reason+'\x1b[0m');
  
  term.onData(d => ws.send(d));
  term.onResize(({cols, rows}) => {
    try{ ws.send(JSON.stringify({cols, rows})) }catch{}
  });
  window.addEventListener('resize', ()=> fitAddon.fit());
</script>
</body>
</html>
