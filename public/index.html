<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>VPS Root</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>body{margin:0;background:#111;color:#0f0}#h{padding:8px;background:#222;display:flex;justify-content:space-between} #t{height:calc(100vh - 36px)}</style>
</head><body>
<div id="h"><span>VPS ROOT (Docker) — пароль обязателен</span><span>apt работает: sudo apt update</span></div>
<div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
const term=new Terminal({cursorBlink:true}); const fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById('t')); fit.fit();
const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);
ws.onopen=()=>{term.writeln('Connected as ROOT inside container. Попробуй: whoami, apt update'); term.focus();}
ws.onmessage=e=>term.write(e.data); ws.onclose=e=>term.writeln('\r\nClosed '+e.reason);
term.onData(d=>ws.send(d)); term.onResize(({cols,rows})=>{try{ws.send(JSON.stringify({cols,rows}))}catch{}}); window.onresize=()=>fit.fit();
</script></body></html>
